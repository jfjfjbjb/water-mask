<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>水印相机</title>
  <style>
    :root {
      --bg-primary: #ffffff;
      --bg-secondary: #f5f5f5;
      --bg-elevated: #fafafa;
      --border-light: #e5e5e5;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --accent: #2563eb;
      --accent-light: rgba(37,99,235,0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .app-container {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #3a3a3a 0%, #1a1a1a 100%);
      box-shadow:
        0 2px 8px rgba(0,0,0,0.2),
        inset 0 1px 0 rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }

    .header-logo::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 100%);
      border-radius: 9px 9px 0 0;
    }

    .header-logo svg {
      width: 18px;
      height: 18px;
      color: white;
      position: relative;
      z-index: 1;
    }

    .header-title {
      font-size: 20px;
      font-weight: 500;
      font-family: Palatino, "Palatino Linotype", Georgia, serif;
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    /* Main */
    .main-row {
      flex: 1;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 1px;
      background: var(--border-light);
      min-height: 0;
    }

    /* Upload */
    .upload-column {
      padding: 16px;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border-light);
    }

    .section-icon svg {
      width: 16px;
      height: 16px;
      color: var(--text-secondary);
    }

    .section-text {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .section-text h2 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .section-text p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Upload zone */
    .upload-zone {
      height: 100px;
      border: 1.5px dashed var(--border-light);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-elevated);
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s;
    }

    .upload-zone:hover {
      border-color: var(--accent);
    }

    .upload-zone-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: var(--bg-primary);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .upload-zone-icon svg {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }

    .upload-zone-text {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .upload-zone-hint {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* File list */
    .file-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-list::-webkit-scrollbar {
      width: 4px;
    }

    .file-list::-webkit-scrollbar-thumb {
      background: var(--border-light);
      border-radius: 2px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--bg-elevated);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .file-item:hover {
      background: var(--accent-light);
      border-color: rgba(37,99,235,0.15);
    }

    .file-item.active {
      background: var(--accent-light);
      border-color: var(--accent);
    }

    .file-thumb {
      width: 40px;
      height: 40px;
      border-radius: 6px;
      object-fit: cover;
      background: var(--border-light);
      flex-shrink: 0;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-meta {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .file-delete {
      width: 24px;
      height: 24px;
      border-radius: 4px;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.3;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .file-delete:hover {
      background: rgba(234,67,53,0.08);
      opacity: 1;
    }

    .file-delete svg {
      width: 13px;
      height: 13px;
      color: #ea4335;
    }

    /* Preview */
    .preview-column {
      padding: 16px;
      background: var(--bg-primary);
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }

    .preview-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 12px;
      background: var(--bg-elevated);
      border-radius: 6px;
      flex-shrink: 0;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .slider-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .slider {
      flex: 1;
      max-width: 100px;
      height: 3px;
      -webkit-appearance: none;
      background: var(--border-light);
      border-radius: 2px;
      outline: none;
    }

    .slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .slider-value {
      font-size: 10px;
      color: var(--text-muted);
      min-width: 28px;
    }

    .download-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      background: var(--accent);
      border: none;
      border-radius: 5px;
      color: white;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .download-btn:hover {
      background: #1d4ed8;
    }

    .download-btn svg {
      width: 13px;
      height: 13px;
    }

    /* Preview area */
    .preview-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-secondary);
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }

    .image-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 100%;
    }

    .preview-image {
      max-width: 100%;
      max-height: calc(100vh - 160px);
      border-radius: 6px;
      display: block;
    }

    .watermark-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .watermark-content {
      position: absolute;
      bottom: 4em;
      text-align: center;
    }

    .watermark-time {
      font-size: 52px;
      font-weight: 300;
      color: white;
      text-shadow: 2px 0 5px rgba(0,0,0,0.5), -2px 0 5px rgba(0,0,0,0.5);
      letter-spacing: -1px;
    }

    .watermark-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
      font-size: 14px;
      color: rgba(255,255,255,0.95);
      text-shadow: 1px 0 3px rgba(0,0,0,0.4);
    }

    .watermark-location {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .watermark-location svg {
      width: 14px;
      height: 14px;
    }

    .watermark-brand {
      position: absolute;
      bottom: 10px;
      right: 12px;
      font-size: 11px;
      color: rgba(255,255,255,0.6);
      text-shadow: 1px 0 2px rgba(0,0,0,0.3);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main-row {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow-y: auto;
        height: auto;
        min-height: 0;
      }

      .upload-column {
        min-height: 450px;
        max-height: none;
        border-bottom: 1px solid var(--border-light);
        overflow-y: auto;
      }

      .file-list {
        max-height: 320px;
        overflow-y: auto;
      }

      .preview-column {
        min-height: 350px;
        overflow: hidden;
      }

      .preview-area {
        overflow: hidden;
        min-height: 0;
      }

      .preview-image {
        max-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="header-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </div>
        <span class="header-title">水印magic</span>
      </div>
    </header>

    <!-- Main -->
    <div class="main-row">
      <!-- Upload -->
      <div class="upload-column">
        <div class="section-header">
          <div class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>
            </svg>
          </div>
          <div class="section-text">
            <h2>文件上传</h2>
            <p>上传并管理您的图片文件</p>
          </div>
        </div>

        <div class="upload-zone">
          <div class="upload-zone-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <span class="upload-zone-text">点击或拖动文件到此区域</span>
          <span class="upload-zone-hint">支持多个文件上传</span>
        </div>

        <div class="file-list">
          <div class="file-item active">
            <img class="file-thumb" src="https://picsum.photos/seed/img1/200/200" alt="thumbnail">
            <div class="file-info">
              <div class="file-name">IMG_20240615_134220.jpg</div>
              <div class="file-meta">2.4 MB · 2024/6/15</div>
            </div>
            <button class="file-delete">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>

          <div class="file-item">
            <img class="file-thumb" src="https://picsum.photos/seed/img2/200/200" alt="thumbnail">
            <div class="file-info">
              <div class="file-name">Screenshot_2024.png</div>
              <div class="file-meta">1.8 MB · 2024/6/12</div>
            </div>
            <button class="file-delete">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>

          <div class="file-item">
            <img class="file-thumb" src="https://picsum.photos/seed/img3/200/200" alt="thumbnail">
            <div class="file-info">
              <div class="file-name">Photo_2024Jun.jpg</div>
              <div class="file-meta">3.2 MB · 2024/6/10</div>
            </div>
            <button class="file-delete">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Preview -->
      <div class="preview-column">
        <div class="section-header">
          <div class="section-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              <line x1="11" y1="8" x2="11" y2="14"/>
              <line x1="8" y1="11" x2="14" y2="11"/>
            </svg>
          </div>
          <div class="section-text">
            <h2>预览编辑</h2>
            <p>调整水印大小，点击修改文字</p>
          </div>
        </div>

        <div class="preview-toolbar">
          <div class="slider-container">
            <span class="slider-label">缩放</span>
            <input type="range" class="slider" min="0.2" max="2.5" step="0.1" value="1">
            <span class="slider-value">1.0x</span>
          </div>
          <button class="download-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            下载
          </button>
        </div>

        <div class="preview-area">
          <div class="image-container">
            <img class="preview-image" src="https://picsum.photos/seed/preview/1000/750" alt="preview">
            <div class="watermark-overlay">
              <div class="watermark-content">
                <div class="watermark-time">16:43</div>
                <div class="watermark-info">
                  <span>2024.6.3 星期一</span>
                  <span class="watermark-location">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    贵阳市南明区万象城
                  </span>
                </div>
              </div>
              <div class="watermark-brand">水印相机</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
